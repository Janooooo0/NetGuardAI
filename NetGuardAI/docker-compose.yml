services:
  netguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: netguardai:latest
    container_name: netguardai
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      WEB_PORT: "8080"
      NETGUARD_DB_PATH: /data/netguard.sqlite3
      NETGUARD_INVENTORY: /app/laptop.csv
      NETGUARD_KEYS_DIR: /app/keys
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/chat}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - netguard-data:/data
      - ./laptop.csv:/app/laptop.csv:ro
      - ./keys:/app/keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  netguard-data:
